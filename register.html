<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">
            <img src="img/logo.png" alt="Discover Colombia">
        </div>
        <nav class="menu">
            <a href="/packages.html"><i class="bi bi-suitcase-lg"></i> Paquetes</a>
            <a href="/vuelos.html"><i class="bi bi-airplane"></i> Vuelos</a>
            <a href="/estadida.html"><i class="bi bi-house-heart-fill"></i> Alojamientos</a>
            <a href="/nosotros.html"><i class="bi bi-people-fill"></i> Nosotros</a>
        </nav>
        <div class="btn-registro">
            <a href="#">Registro</a>
        </div>
    </header>
    <div class="form-container">
        <h1 id="titulo-registro">Crea una cuenta</h1>

        <!-- Selector de rol -->
        <div id="role-selector" class="role-selector">
            <div class="role-options">
                <button id="role-user" class="role-btn">Registrarse como Usuario</button>
                <button id="role-admin" class="role-btn admin">Registrarse como Administrador</button>
            </div>
        </div>

        <!-- Formulario (oculto hasta seleccionar rol) -->
        <form id="register-form" style="display:none;">
            <div class="form-row">
                <div class="form-group">
                    <input type="text" placeholder="Nombre" required id="nombre">
                </div>
                <div class="form-group">
                    <input type="text" placeholder="Apellido" required id="apellido">
                </div>
            </div>

            <div class="form-group full-width">
                <input type="email" placeholder="Email" required id="email">
            </div>

            <div class="form-group full-width">
                <input type="password" placeholder="Contraseña" required id="password">
            </div>

            <!-- Campo extra para administradores -->
            <div class="form-group full-width" id="admin-code-group" style="display:none;">
                <input type="text" placeholder="Código de administrador" id="adminCode">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">Estoy de acuerdo con los términos y condiciones</label>
            </div>

            <div class="form-actions">
                <button type="button" id="btn-back-role" class="secondary-btn">Volver</button>
                <button type="submit" class="submit-btn">Crear cuenta</button>
            </div>

            <div class="register-link">
                Ya tengo una cuenta, <a href="login.html">Acceder</a>
            </div>
        </form>
    </div>
    <script src="register.js"></script>
</body>

</html>
